version: 1
runs: 3
schedule: paired-shuffled

models:
  default:
    provider: deepseek-official
    model: deepseek-v4-flash
    temperature: 0

variants:
  baseline:
    profile: headless
  experiment:
    # Create this profile with the plugin or configuration you want to compare.
    profile: headless-experiment

scenarios:
  - id: basic/reply
    fixture: fixture
    task: basic-task.md
    evaluators:
      type: exact
      expected: expected.txt
