version: 1
runs: 3
schedule: paired-shuffled

models:
  ox-alpha:
    provider: openrouter
    model: stealth/ox-alpha
    temperature: 1
    reasoningEffort: max

variants:
  baseline:
    profile: headless
  memcore:
    profile: headless-memcore

scenarios:
  - id: fact/aurora-marker
    episodes:
      - id: seed
        fixture: memcore/fixtures/fact-aurora/seed
        task: memcore/tasks/store-one.md
        state: { workspace: reset, persistent: reset, session: fresh, process: fresh }
      - id: recall
        fixture: memcore/fixtures/fact-aurora/recall
        task: memcore/tasks/recall.md
        state: { workspace: reset, persistent: retain, session: fresh, process: restart }
    evaluators: { type: exact, expectedValue: "AURORA-17-CRANE\n" }

  - id: fact/cirrus-date
