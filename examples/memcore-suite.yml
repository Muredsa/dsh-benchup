  - id: control/json-file
    task: memcore/tasks/control-json.md
    evaluators:
      mode: all
      checks:
        - type: file
          path: result.json
        - type: json
          path: result.json
          schema:
            type: object
            additionalProperties: false
            required: [suite, mode, count]
            properties:
              suite: { const: memcore }
              mode: { const: control }
              count: { const: 24 }

  - id: control/code-repair
    fixture: ox-alpha/code-repair
    task: ox-alpha/tasks/03-code-repair.md
    evaluators:
      mode: all
      checks:
        - type: command
          command: [node, --test, checks/slug-check.mjs]
        - type: file
          path: src/slug.js
